---
name: "Execute OCI Pipeline"

on:
  workflow_dispatch:

# CRITICAL: These override any repository secret
env:
  OCI_CLI_REGION: us-phoenix-1
  OCI_RESOURCE_PRINCIPAL_REGION: us-phoenix-1
  TF_VAR_region: us-phoenix-1

permissions:
  contents: read

jobs:
  terraform:
    name: "Terraform OCI Pipeline"
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug Region Resolution
        run: |
          echo "=== Environment Variables ==="
          echo "OCI_CLI_REGION=$OCI_CLI_REGION"
          echo "OCI_RESOURCE_PRINCIPAL_REGION=$OCI_RESOURCE_PRINCIPAL_REGION"
          echo "TF_VAR_region=$TF_VAR_region"
          echo "OCI_REGION=$OCI_REGION"
          echo "=== All OCI env vars ==="
          env | grep -i oci || echo "(none)"
          echo "=== Provider block in module ==="
          grep -n -A 8 'provider "oci"' oci-stack-module/main.tf
          echo "=== Region in root main.tf ==="
          grep -n "region" main.tf

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Setup SSH Private Key
        run: |
          echo "${{ secrets.PKEY }}" > pkey.pem
          chmod 600 pkey.pem
          echo "TF_VAR_pkey_path=$(pwd)/pkey.pem" >> $GITHUB_ENV

      - name: Setup Terraform Vars
        run: |
          echo "TF_VAR_tenancy_ocid=${{ secrets.TENANCY_OCID }}" >> $GITHUB_ENV
          echo "TF_VAR_user_ocid=${{ secrets.USER_OCID }}" >> $GITHUB_ENV
          echo "TF_VAR_fp=${{ secrets.FP }}" >> $GITHUB_ENV
          echo "TF_VAR_ssh_pub_key=${{ secrets.SSH_PUB_KEY }}" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
